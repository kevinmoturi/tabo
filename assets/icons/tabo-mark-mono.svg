<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Tabo monochrome">
  <title>Tabo — monochrome / themed-icon layer</title>
  <!-- Android 13+ monochrome layer, notification icon, and any single-colour use.
       Alpha only — the system supplies the colour. Everything sits inside the
       66dp safe circle so no launcher mask can clip it. Single even-odd path for
       the glass so it converts cleanly to a VectorDrawable. -->
  <g fill="#FFFFFF">
    <circle cx="54" cy="54" r="31" fill="none" stroke="#FFFFFF" stroke-width="3.4"/>
    <circle cx="54" cy="54" r="27.2" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8"/>
    <path fill-rule="evenodd" d="M54 30.5A23.5 23.5 0 1 1 54 77.5A23.5 23.5 0 1 1 54 30.5Z
             M54 41.5c-4.6 0-8.3 3.8-8.3 8.5 0 2.7 1.3 5.2 3.3 6.7l-3.1 8.6c-.5 1.5.6 3 2.1 3h12c1.5 0 2.6-1.5 2.1-3l-3.1-8.6c2-1.5 3.3-4 3.3-6.7 0-4.7-3.7-8.5-8.3-8.5Z"/>
  </g>
</svg>
